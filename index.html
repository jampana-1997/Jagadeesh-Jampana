<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training & Placement Dashboard</title>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6f9;
margin:0;
padding:20px;
}

.header{
background:#003366;
color:#fff;
padding:20px;
border-radius:10px;
text-align:center;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
font-size:35px;
margin:0;
color:#003366;
}

.card p{
margin-top:10px;
font-weight:bold;
}

#searchBox{
width:100%;
padding:10px;
margin-bottom:15px;
font-size:16px;
}

table{
background:#fff;
}

/* FILTER INPUT ROW */
thead input{
width:100%;
padding:5px;
font-size:12px;
}
</style>
</head>

<body>

<div class="header">
<h1>TRAINING & PLACEMENT CELL</h1>
<h3>Placement Dashboard 2026</h3>
</div>

<div class="cards">
<div class="card">
<h2 id="students">0</h2>
<p>Total Students</p>
</div>

<div class="card">
<h2 id="offers">0</h2>
<p>Total Offers</p>
</div>

<div class="card">
<h2 id="placed">0</h2>
<p>Placed Students</p>
</div>

<div class="card">
<h2 id="companies">0</h2>
<p>Companies</p>
</div>
</div>

<table id="placementTable" class="display nowrap" style="width:100%">
<thead>
<tr>
<th>Roll Number</th>
<th>Batch</th>
<th>Name</th>
<th>Gender</th>
<th>Branch</th>
<th>Mobile</th>
<th>Email</th>
<th>Campus</th>
<th>Company</th>
<th>Role</th>
<th>Nature</th>
<th>Paid/Unpaid</th>
<th>Stipend</th>
<th>Package</th>
<th>Internship Letter</th>
<th>Offer Letter</th>
</tr>
<tr id="filterRow"></tr>
</thead>
<tbody></tbody>
</table>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

const sheetURL =
"https://docs.google.com/spreadsheets/d/1w-EYhI3uYZABT87dHevtem6XYpDHS4tX/gviz/tq?tqx=out:csv";

Papa.parse(sheetURL,{
download:true,
header:true,
skipEmptyLines:true,

complete:function(results){

let data = results.data;

// TOTAL STUDENTS
document.getElementById("students").innerHTML = data.length;

// FILTER OFFERS (multiple offers safe check)
let offers = data.filter(x => x["Company Placed"] && x["Company Placed"].trim() !== "");

document.getElementById("offers").innerHTML = offers.length;
document.getElementById("placed").innerHTML = offers.length;

// UNIQUE COMPANIES
let companies = new Set(offers.map(x => x["Company Placed"]));
document.getElementById("companies").innerHTML = companies.size;

// TABLE ROWS
data.forEach(row=>{
$('#placementTable tbody').append(`
<tr>
<td>${row["Roll Number"]||""}</td>
<td>${row["Batch"]||""}</td>
<td>${row["Name"]||""}</td>
<td>${row["Gender"]||""}</td>
<td>${row["Branch"]||""}</td>
<td>${row["Mobile Number"]||""}</td>
<td>${row["Email Id"]||""}</td>
<td>${row["On Campus/ Off Campus"]||""}</td>
<td>${row["Company Placed"]||""}</td>
<td>${row["Role"]||""}</td>
<td>${row["Nature of the Company"]||""}</td>
<td>${row["Paid/Unpaid Interns"]||""}</td>
<td>${row["Stipend (Per Month)"]||""}</td>
<td>${row["Salary package"]||""}</td>
<td>${row["Internship Letter"]||""}</td>
<td>${row["Offer Letter"]||""}</td>
</tr>
`);
});

// INIT DATATABLE
let table = $('#placementTable').DataTable({
responsive:true,
pageLength:25,
dom:'Bfrtip',
buttons:['excelHtml5','pdfHtml5','print']
});

// 🔥 COLUMN WISE FILTERS (HEADER INPUTS)
$('#placementTable thead tr:eq(1) th').each(function(i){
$(this).html('<input type="text" placeholder="Search" />');

$('input', this).on('keyup change', function(){
if(table.column(i).search() !== this.value){
table.column(i).search(this.value).draw();
}
});
});

}

});

</script>

</body>
</html>
