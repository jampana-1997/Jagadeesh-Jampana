<!DOCTYPE html>
<html>
<head>
    <title>HR Data from Google Sheet CSV</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
        }

        h2 {
            text-align: center;
        }

        table {
            border-collapse: collapse;
            width: 95%;
            margin: auto;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }

        th {
            background: #007BFF;
            color: white;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }
    </style>
</head>

<body>

<h2>HR Data (Google Sheet Live)</h2>

<table id="hrTable">
    <tr>
        <th>Sl.No</th>
        <th>Company</th>
        <th>Name of Employer</th>
        <th>Designation</th>
        <th>Mobile No</th>
        <th>Landline</th>
        <th>Email ID</th>
    </tr>
</table>

<script>

// ✅ Your CSV link
const sheetURL = "https://docs.google.com/spreadsheets/d/1wgfc0hnKgD8icjXrDQWqm_2Zlt1Cj27l/export?format=csv";

fetch(sheetURL)
.then(res => res.text())
.then(data => {

    let rows = data.split("\n").slice(1);
    let table = document.getElementById("hrTable");

    rows.forEach(row => {
        let cols = row.split(",");

        if(cols.length >= 6){
            let tr = `<tr>
                <td>${cols[0] || ""}</td>
                <td>${cols[1] || ""}</td>
                <td>${cols[2] || ""}</td>
                <td>${cols[3] || ""}</td>
                <td>${cols[4] || ""}</td>
                <td>${cols[5] || ""}</td>
                <td>${cols[6] || ""}</td>
            </tr>`;

            table.innerHTML += tr;
        }
    });

});

</script>

</body>
</html>
