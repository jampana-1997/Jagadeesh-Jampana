<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Placement Data</title>

<style>

body{
font-family:Arial;
margin:20px;
}

#search{
width:300px;
padding:8px;
margin-bottom:10px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #ccc;
padding:8px;
text-align:left;
}

th{
background:#003366;
color:white;
position:sticky;
top:0;
}

.filter{
width:100%;
padding:5px;
}

</style>

</head>
<body>

<input type="text" id="search" placeholder="Search..." onkeyup="globalSearch()">

<table id="sheetTable">

<thead id="thead"></thead>

<tbody id="tbody"></tbody>

</table>

<script>

const sheetURL =
"https://docs.google.com/spreadsheets/d/1wB72mFM70AToOAfPmAJepm9IR8HH0lV4M2sVsap3ZnM/gviz/tq?tqx=out:csv";

fetch(sheetURL)
.then(res=>res.text())
.then(csv=>{

let rows = csv.split("\n").map(r=>r.split(","));

let headers = rows[0];

let headerRow = "<tr>";
let filterRow = "<tr>";

headers.forEach((h,index)=>{

headerRow += `<th>${h.replace(/"/g,"")}</th>`;

filterRow += `
<th>
<input
class="filter"
type="text"
placeholder="Filter"
onkeyup="columnFilter(${index},this.value)">
</th>`;
});

headerRow += "</tr>";
filterRow += "</tr>";

document.getElementById("thead").innerHTML =
headerRow + filterRow;

let body = "";

for(let i=1;i<rows.length;i++){

body += "<tr>";

rows[i].forEach(col=>{

body += `<td>${col.replace(/"/g,"")}</td>`;

});

body += "</tr>";
}

document.getElementById("tbody").innerHTML = body;

});

function globalSearch(){

let value =
document.getElementById("search")
.value.toUpperCase();

let rows =
document.querySelectorAll("#tbody tr");

rows.forEach(row=>{

let text =
row.innerText.toUpperCase();

row.style.display =
text.includes(value) ? "" : "none";

});

}

function columnFilter(col,value){

value = value.toUpperCase();

let rows =
document.querySelectorAll("#tbody tr");

rows.forEach(row=>{

let cell =
row.cells[col];

if(!cell) return;

let text =
cell.innerText.toUpperCase();

row.style.display =
text.includes(value) ? "" : "none";

});

}

</script>

</body>
</html>
