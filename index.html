<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T&P Dashboard</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6f9;
margin:0;
}

.header{
background:#003366;
color:white;
padding:20px;
text-align:center;
}

.dashboard{
display:flex;
gap:20px;
padding:20px;
flex-wrap:wrap;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
flex:1;
min-width:220px;
text-align:center;
}

.card h2{
margin:0;
color:#003366;
}

.card p{
font-size:30px;
font-weight:bold;
color:#0066cc;
}

.controls{
padding:20px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

input,select{
padding:10px;
border:1px solid #ccc;
border-radius:5px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:left;
}

th{
background:#003366;
color:white;
position:sticky;
top:0;
}

tr:nth-child(even){
background:#f9f9f9;
}
</style>
</head>

<body>

<div class="header">
<h1>TRAINING & PLACEMENT CELL DASHBOARD</h1>
</div>

<div class="dashboard">

<div class="card">
<h2>Total Students</h2>
<p id="students">0</p>
</div>

<div class="card">
<h2>Offer Letters</h2>
<p id="offers">0</p>
</div>

<div class="card">
<h2>Companies</h2>
<p id="companies">0</p>
</div>

</div>

<div class="controls">
<input type="text" id="searchBox" placeholder="Search..." onkeyup="filterTable()">

<select id="statusFilter" onchange="filterTable()">
<option value="">All</option>
<option value="Selected">Selected</option>
<option value="Not Selected">Not Selected</option>
</select>
</div>

<table id="dataTable">
<thead>
<tr id="tableHead"></tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<script>

// PUBLISH TO WEB CSV URL
const csvUrl =
"https://docs.google.com/spreadsheets/d/1wB72mFM70AToOAfPmAJepm9IR8HH0lV4M2sVsap3ZnM/gviz/tq?tqx=out:csv";

fetch(csvUrl)
.then(res => res.text())
.then(data => {

let rows = data.trim().split("\n").map(r=>r.split(","));

let headers = rows[0];

let headHtml = "";

headers.forEach(h=>{
headHtml += `<th>${h.replace(/"/g,"")}</th>`;
});

document.getElementById("tableHead").innerHTML = headHtml;

let bodyHtml = "";

for(let i=1;i<rows.length;i++){

bodyHtml += "<tr>";

rows[i].forEach(col=>{
bodyHtml += `<td>${col.replace(/"/g,"")}</td>`;
});

bodyHtml += "</tr>";
}

document.getElementById("tableBody").innerHTML = bodyHtml;

document.getElementById("students").innerText = rows.length-1;

})
.catch(err=>console.log(err));

function filterTable(){

let input =
document.getElementById("searchBox")
.value.toUpperCase();

let tr =
document.querySelectorAll("#tableBody tr");

tr.forEach(row=>{

let txt =
row.innerText.toUpperCase();

if(txt.indexOf(input)>-1){
row.style.display="";
}
else{
row.style.display="none";
}

});

}

</script>

</body>
</html>
