<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rummy Score Board</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    color:gold;
}

table{
    width:90%;
    margin:auto;
    border-collapse:collapse;
}

th{
    background:#ff9800;
    padding:12px;
}

td{
    padding:10px;
    border-bottom:1px solid #444;
}

tr:nth-child(even){
    background:#222;
}

.eliminated{
    color:red;
    font-weight:bold;
}

.safe{
    color:#00ff66;
}

</style>

</head>

<body>

<h1>RUMMY SCORE BOARD</h1>

<table id="scoreTable">

<thead>
<tr id="headerRow">
</tr>
</thead>

<tbody id="tableBody">
</tbody>

</table>

<script>

const sheetURL="YOUR_CSV_LINK_HERE";

fetch(sheetURL)

.then(response=>response.text())

.then(data=>{

const rows=data.trim().split("\n")
.map(r=>r.split(","));

const headers=rows[0];

let headHTML="";

headers.forEach(h=>{

headHTML+=`<th>${h}</th>`;

});

headHTML+=`<th>Status</th>`;

document.getElementById("headerRow").innerHTML=headHTML;

let bodyHTML="";

for(let i=1;i<rows.length;i++){

let row=rows[i];

let total=parseInt(row[row.length-1]);

let status;

if(total>=200){

status='<span class="eliminated">ELIMINATED</span>';

}else{

status='<span class="safe">PLAYING</span>';

}

bodyHTML+="<tr>";

row.forEach(cell=>{

bodyHTML+=`<td>${cell}</td>`;

});

bodyHTML+=`<td>${status}</td>`;

bodyHTML+="</tr>";

}

document.getElementById("tableBody").innerHTML=bodyHTML;

})

.catch(err=>{

console.log(err);

});

</script>

</body>
</html>
