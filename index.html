<!DOCTYPE html>
<html>
<head>
  <title>Placement Dashboard</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, select { margin: 5px; padding: 8px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; }
  </style>
</head>
<body>

<h2>Placement Data Search</h2>

<!-- Global Search -->
<input type="text" id="globalSearch" placeholder="Search anything..." onkeyup="filterData()">

<br>

<!-- Separate Filters -->
<input type="text" id="roll" placeholder="Roll Number" onkeyup="filterData()">
<input type="text" id="name" placeholder="Name" onkeyup="filterData()">
<input type="text" id="branch" placeholder="Branch" onkeyup="filterData()">
<input type="text" id="company" placeholder="Company" onkeyup="filterData()">

<select id="campus" onchange="filterData()">
  <option value="">All Campus</option>
  <option value="On Campus">On Campus</option>
  <option value="Off Campus">Off Campus</option>
</select>

<table>
  <thead>
    <tr id="headerRow"></tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>
const sheetID = "1wB72mFM70AToOAfPmAJepm9IR8HH0lV4M2sVsap3ZnM";
const url = `https://docs.google.com/spreadsheets/d/${sheetID}/edit?usp=sharing`;

let fullData = [];

fetch(url)
  .then(res => res.json())
  .then(data => {
    fullData = data;
    createTable(data);
  });

function createTable(data) {
  const headerRow = document.getElementById("headerRow");
  headerRow.innerHTML = "";

  Object.keys(data[0]).forEach(key => {
    headerRow.innerHTML += `<th>${key}</th>`;
  });

  displayData(data);
}

function displayData(data) {
  const tableBody = document.getElementById("tableBody");
  tableBody.innerHTML = "";

  data.forEach(row => {
    let tr = "<tr>";
    Object.values(row).forEach(val => {
      tr += `<td>${val}</td>`;
    });
    tr += "</tr>";
    tableBody.innerHTML += tr;
  });
}

function filterData() {
  const global = document.getElementById("globalSearch").value.toLowerCase();
  const roll = document.getElementById("roll").value.toLowerCase();
  const name = document.getElementById("name").value.toLowerCase();
  const branch = document.getElementById("branch").value.toLowerCase();
  const company = document.getElementById("company").value.toLowerCase();
  const campus = document.getElementById("campus").value.toLowerCase();

  const filtered = fullData.filter(row => {
    return (
      Object.values(row).some(val => val.toLowerCase().includes(global)) &&
      row["Roll Number"]?.toLowerCase().includes(roll) &&
      row["Name"]?.toLowerCase().includes(name) &&
      row["Branch"]?.toLowerCase().includes(branch) &&
      row["Company Placed"]?.toLowerCase().includes(company) &&
      (campus === "" || row["On Campus/ Off Campus"]?.toLowerCase().includes(campus))
    );
  });

  displayData(filtered);
}
</script>

</body>
</html>
