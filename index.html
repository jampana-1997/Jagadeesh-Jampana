<!DOCTYPE html>
<html>
<head>
  <title>Card Guess Game</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: #111;
      color: white;
    }

    .card {
      width: 120px;
      height: 160px;
      margin: 50px auto;
      perspective: 1000px;
    }

    .inner {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.8s;
      transform-style: preserve-3d;
    }

    .flipped {
      transform: rotateY(180deg);
    }

    .front, .back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
    }

    .front {
      background: white;
      color: black;
    }

    .back {
      background: red;
      transform: rotateY(180deg);
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 18px;
    }
  </style>
</head>
<body>

<h2>🃏 Card Guess Game</h2>

<div class="card">
  <div class="inner" id="card">
    <div class="front" id="front">?</div>
    <div class="back" id="back">5</div>
  </div>
</div>

<button onclick="showCard()">Show Card</button>
<button onclick="guess('inside')">Inside</button>
<button onclick="guess('outside')">Outside</button>

<h3 id="result"></h3>

<script>
let number = Math.floor(Math.random() * 10) + 1;

function showCard() {
  document.getElementById("back").innerText = number;
  document.getElementById("card").classList.add("flipped");
}

function guess(type) {
  // simple logic example
  if (number <= 5 && type === "inside") {
    document.getElementById("result").innerText = "🎉 Correct Guess!";
  } else if (number > 5 && type === "outside") {
    document.getElementById("result").innerText = "🎉 Correct Guess!";
  } else {
    document.getElementById("result").innerText = "❌ Wrong Guess!";
  }

  // reset
  setTimeout(() => {
    document.getElementById("card").classList.remove("flipped");
    number = Math.floor(Math.random() * 10) + 1;
  }, 1500);
}
</script>

</body>
</html>
