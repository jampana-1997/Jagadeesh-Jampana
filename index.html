<!DOCTYPE html>
<html>
<head>
  <title>Placements</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
      background: white;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #333;
      color: white;
    }
  </style>
</head>

<body>

<h1>Placements</h1>

<input type="text" id="search" placeholder="Search anything (Roll No, Name, Company...)" onkeyup="searchData()">

<table>
  <thead>
    <tr id="headerRow"></tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>
const sheetID = "1wB72mFM70AToOAfPmAJepm9IR8HH0lV4M2sVsap3ZnM";

// Using sheet index (safe)
const url = `https://opensheet.elk.sh/${sheetID}/1`;

let fullData = [];

fetch(url)
  .then(res => res.json())
  .then(data => {
    fullData = data;
    createTable(data);
  });

function createTable(data) {
  const headerRow = document.getElementById("headerRow");
  headerRow.innerHTML = "";

  Object.keys(data[0]).forEach(key => {
    headerRow.innerHTML += `<th>${key}</th>`;
  });

  displayData(data);
}

function displayData(data) {
  const tableBody = document.getElementById("tableBody");
  tableBody.innerHTML = "";

  data.forEach(row => {
    let tr = "<tr>";
    Object.values(row).forEach(val => {
      tr += `<td>${val}</td>`;
    });
    tr += "</tr>";
    tableBody.innerHTML += tr;
  });
}

function searchData() {
  const value = document.getElementById("search").value.toLowerCase();

  const filtered = fullData.filter(row =>
    Object.values(row).some(val =>
      String(val).toLowerCase().includes(value)
    )
  );

  displayData(filtered);
}
</script>

</body>
</html>
