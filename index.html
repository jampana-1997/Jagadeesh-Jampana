<body>

<div class="header">

<table id="placementTable" class="display nowrap" style="width:100%">
<thead>
<tr>
<th>S.No</th>
<th>Roll No</th>

<th>Sector</th>

</tr>
</thead>

<tfoot>
<tr>
<th>S.No</th>
<th>Roll No</th>
<th>Year</th>
<th>Student Name</th>
<th>Gender</th>
<th>Branch</th>
<th>Mobile</th>
<th>Email</th>
<th>Mode</th>
<th>Company</th>
<th>Job Role</th>
<th>Sector</th>
<th>Paid/Unpaid</th>
<th>Salary</th>
<th>Package</th>
</tr>
</tfoot>

<tbody>
</tbody>
</table>

<script>

const csvUrl =
"https://docs.google.com/spreadsheets/d/1wB72mFM70AToOAfPmAJepm9IR8HH0lV4M2sVsap3ZnM/gviz/tq?tqx=out:csv";

fetch(csvUrl)
.then(response => response.text())
.then(csv => {

const rows = csv.trim().split("\n").map(row => row.split(","));

let tbody = "";

for(let i=1;i<rows.length;i++){

tbody += "<tr>";

for(let j=0;j<15;j++){
tbody += `<td>${rows[i][j] ? rows[i][j].replace(/"/g,'') : ''}</td>`;
}

tbody += "</tr>";
}

document.querySelector("#placementTable tbody").innerHTML = tbody;

$('#placementTable tfoot th').each(function(){
$(this).html('<input type="text" placeholder="Filter" />');
});

var table = $('#placementTable').DataTable({
scrollX:true,
pageLength:50,
dom:'Bfrtip',
buttons:['excel','csv','pdf']
});

table.columns().every(function(){
var that=this;

$('input',this.footer()).on('keyup change clear',function(){

if(that.search()!==this.value){
that.search(this.value).draw();
}

});
});

});

</script>

</body>
</html>
