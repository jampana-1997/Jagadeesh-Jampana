<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Jagadeesh Rummy Score</title>

<style>

body{
font-family:Arial;
text-align:center;
background:#f5f5f5;
}

h1{
font-size:50px;
}

table{
margin:auto;
border-collapse:collapse;
}

td,th{
border:1px solid #333;
padding:10px;
min-width:120px;
text-align:center;
}

.score{

background:yellow;
font-size:28px;
font-weight:bold;

}

.eliminated{

background:red;
color:white;
font-size:28px;
font-weight:bold;

}

.name{

background:yellow;
font-weight:bold;

}

.name-red{

background:red;
color:white;
font-weight:bold;

}

.winner{

background:#00c853;
color:white;
font-weight:bold;

}

.winner img{

width:120px;
height:120px;
border-radius:50%;
border:5px solid gold;

animation:zoom 1s infinite alternate;

}

img{

width:80px;
height:80px;
border-radius:50%;
object-fit:cover;
border:3px solid white;
margin-bottom:10px;

}

@keyframes zoom{

from{

transform:scale(1);

}

to{

transform:scale(1.1);

}

}

</style>

</head>

<body>

<h1>Jagadeesh Rummy Score</h1>

<audio id="winSound">

<source src="https://www.soundjay.com/human/applause-8.mp3" type="audio/mpeg">

</audio>

<div id="table"></div>

<script>

const csvUrl="https://docs.google.com/spreadsheets/d/e/2PACX-1vSDqXx9kHrTNf-SQLWwgLO4igXPZIGzuXkiFKIyHBPUe9EFsCfrVWvVZCupxEzCWtnSeVDBlUEGytOe/pub?output=csv";

const photos=[

"https://drive.google.com/thumbnail?id=1RpkTUrawmFILNuMIGAKAgYRIRvOeNLkC&sz=w300",

"https://drive.google.com/thumbnail?id=1RbW4YresUsYVsbOc2hXzGJ4gTl6WyCQu&sz=w300",

"https://drive.google.com/thumbnail?id=1nnyC2ve1Pm2VkuLEWSUtXr0p1izBtrIz&sz=w300",

"https://drive.google.com/thumbnail?id=1lg-XQFaHFAlqcN1UVDGcwCOlvvTx08E0&sz=w300",

"https://drive.google.com/thumbnail?id=1LqEXOeLG0Q1XiRRRFNC9uUCY2kKCsWPa&sz=w300"

];

fetch(csvUrl)

.then(res=>res.text())

.then(csv=>{

const rows=csv.trim().split("\n").map(r=>r.split(","));

let scores=[];

for(let i=0;i<rows[0].length;i++){

scores.push(parseInt(rows[0][i])||0);

}

let active=scores.filter(x=>x<201);

let winner=Math.min(...active);

let html="<table>";

for(let i=0;i<rows.length;i++){

html+="<tr>";

for(let j=0;j<rows[i].length;j++){

let value=rows[i][j].trim();

let score=parseInt(rows[0][j])||0;

if(i===0){

if(score===winner){

html+=`

<td class="winner">

🏆

<br>

${score}

</td>

`;

}

else if(score>=201){

html+=`

<td class="eliminated">

${score}

<br>

ELIMINATED

</td>

`;

}

else{

html+=`

<td class="score">

${score}

</td>

`;

}

}

else if(i===1){

if(score===winner){

setTimeout(()=>{

document.getElementById("winSound").play();

},1000);

html+=`

<th class="winner">

🏆 CONGRATULATIONS 🏆

<br><br>

<img src="${photos[j]}">

<br>

${value}

<br>

WINNER

</th>

`;

}

else if(score>=201){

html+=`

<th class="name-red">

<img src="${photos[j]}">

<br>

${value}

<br>

ELIMINATED

</th>

`;

}

else{

html+=`

<th class="name">

<img src="${photos[j]}">

<br>

${value}

</th>

`;

}

}

else{

html+=`

<td>

${value}

</td>

`;

}

}

html+="</tr>";

}

html+="</table>";

document.getElementById("table").innerHTML=html;

});

</script>

</body>

</html>
