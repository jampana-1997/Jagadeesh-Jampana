<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MGIT Placement Dashboard</title>

<link rel="stylesheet"
href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">

<style>

body{
font-family:Arial;
background:#f4f6f9;
margin:0;
padding:20px;
}

.header{
background:#003366;
color:white;
padding:15px;
text-align:center;
border-radius:10px;
}

.cards{
display:flex;
gap:20px;
margin-top:20px;
flex-wrap:wrap;
}

.card{
flex:1;
min-width:220px;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
text-align:center;
}

.card h2{
margin:0;
color:#003366;
font-size:32px;
}

.card p{
margin-top:10px;
font-weight:bold;
}

table{
width:100%;
margin-top:20px;
}

</style>
</head>

<body>

<div class="header">
<h1>TRAINING & PLACEMENT CELL</h1>
<h3>Placement Dashboard 2026</h3>
</div>

<div class="cards">

<div class="card">
<h2 id="students">0</h2>
<p>Total Students</p>
</div>

<div class="card">
<h2 id="offers">0</h2>
<p>Total Offers</p>
</div>

<div class="card">
<h2 id="placed">0</h2>
<p>Placed Students</p>
</div>

<div class="card">
<h2 id="companies">0</h2>
<p>Companies</p>
</div>

</div>

<table id="placementTable" class="display">
<thead>
<tr>
<th>Roll Number</th>
<th>Batch</th>
<th>Name</th>
<th>Gender</th>
<th>Branch</th>
<th>Mobile</th>
<th>Email</th>
<th>Campus</th>
<th>Company</th>
<th>Role</th>
<th>Nature</th>
<th>Paid/Unpaid</th>
<th>Stipend</th>
<th>Package</th>
<th>Internship Letter</th>
<th>Offer Letter</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

const sheetURL =
"https://docs.google.com/spreadsheets/d/1wB72mFM70AToOAfPmAJepm9IR8HH0lV4M2sVsap3ZnM/export?format=csv";

Papa.parse(sheetURL,{
download:true,
header:true,
complete:function(results){

let data=results.data;

let totalStudents=data.length;

let totalOffers=data.filter(
x=>x["Company Placed"]
).length;

let companies=
new Set(
data.map(x=>x["Company Placed"])
.filter(Boolean)
);

document.getElementById("students").innerHTML=
totalStudents;

document.getElementById("offers").innerHTML=
totalOffers;

document.getElementById("placed").innerHTML=
totalOffers;

document.getElementById("companies").innerHTML=
companies.size;

data.forEach(row=>{

$("#placementTable tbody").append(`
<tr>
<td>${row["Roll Number"]||""}</td>
<td>${row["Batch"]||""}</td>
<td>${row["Name"]||""}</td>
<td>${row["Gender"]||""}</td>
<td>${row["Branch"]||""}</td>
<td>${row["Mobile Number"]||""}</td>
<td>${row["Email Id"]||""}</td>
<td>${row["On Campus/ Off Campus"]||""}</td>
<td>${row["Company Placed"]||""}</td>
<td>${row["Role"]||""}</td>
<td>${row["Nature of the Company"]||""}</td>
<td>${row["Paid/Unpaid Interns"]||""}</td>
<td>${row["Stipend (Per Month)"]||""}</td>
<td>${row["Salary package"]||""}</td>
<td>${row["Internship Letter"]||""}</td>
<td>${row["Offer Letter"]||""}</td>
</tr>
`);

});

$('#placementTable').DataTable({
pageLength:25,
responsive:true
});

}
});

</script>

</body>
</html>
