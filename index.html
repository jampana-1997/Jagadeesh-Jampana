<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Training & Placement Portal</title>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6f9;
margin:0;
padding:20px;
}

.header{
background:#003366;
color:#fff;
padding:20px;
text-align:center;
border-radius:10px;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
margin:0;
color:#003366;
}

.card h1{
color:#0077cc;
}

.filters{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.filters select,
.filters input{
padding:10px;
border:1px solid #ccc;
border-radius:5px;
}

.chart-box{
background:#fff;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

table.dataTable thead th{
background:#003366 !important;
color:#fff !important;
}
</style>
</head>

<body>

<div class="header">
<h1>TRAINING & PLACEMENT CELL</h1>
<h3>Student Placement Management Portal</h3>
</div>

<div class="cards">

<div class="card">
<h2>Total Students</h2>
<h1 id="students">0</h1>
</div>

<div class="card">
<h2>Total Companies</h2>
<h1 id="companies">0</h1>
</div>

<div class="card">
<h2>Offer Letters</h2>
<h1 id="offers">0</h1>
</div>

<div class="card">
<h2>Highest Package</h2>
<h1 id="highestPackage">0</h1>
</div>

</div>

<div class="filters">

<input type="text" id="globalSearch" placeholder="Search Student / Company">

<select id="branchFilter">
<option value="">All Branches</option>
</select>

<select id="companyFilter">
<option value="">All Companies</option>
</select>

<select id="yearFilter">
<option value="">All Years</option>
</select>

</div>

<div class="chart-box">
<canvas id="companyChart"></canvas>
</div>

<table id="placementTable" class="display nowrap" style="width:100%">

<thead>
<tr>
<th>S.No</th>
<th>Roll No</th>
<th>Year</th>
<th>Student Name</th>
<th>Gender</th>
<th>Branch</th>
<th>Mobile</th>
<th>Email</th>
<th>Mode</th>
<th>Company</th>
<th>Job Role</th>
<th>Sector</th>
<th>Paid/Unpaid</th>
<th>Salary</th>
<th>Package</th>
</tr>
</thead>

<tbody>
</tbody>

</table>

</body>
</html>
