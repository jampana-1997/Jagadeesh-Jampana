<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placement Dashboard</title>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:#0B1F3A;
margin:0;
padding:20px;
color:white;
}

.header{
text-align:center;
font-size:30px;
font-weight:bold;
margin-bottom:20px;
}

.cards{
display:flex;
gap:20px;
flex-wrap:wrap;
margin-bottom:20px;
}

.card{
background:#123A6D;
padding:20px;
border-radius:12px;
flex:1;
min-width:200px;
text-align:center;
}

.card h2{
margin:0;
font-size:30px;
}

.chart-container{
background:white;
padding:20px;
border-radius:10px;
margin-top:20px;
}

table{
background:white;
color:black;
}

.loading{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#081426;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
z-index:9999;
}

</style>
</head>
<body>

<div class="loading" id="loader">
Loading Placement Data...
</div>

<div class="header">
Training & Placement Dashboard
</div>

<div class="cards">

<div class="card">
<h2 id="students">0</h2>
<p>Total Students</p>
</div>

<div class="card">
<h2 id="offers">0</h2>
<p>Total Offers</p>
</div>

</div>

<table id="placementTable" class="display" width="100%">
<thead>
<tr>

<th>Roll Number</th>
<th>Batch</th>
<th>Name</th>
<th>Gender</th>
<th>Branch</th>
<th>Mobile Number</th>
<th>Email Id</th>
<th>On/Off Campus</th>
<th>Company</th>
<th>Role</th>
<th>Nature Company</th>
<th>Paid/Unpaid</th>
<th>Stipend</th>
<th>Salary Package</th>
<th>Internship Letter</th>
<th>Offer Letter</th>

</tr>
</thead>
<tbody></tbody>
</table>

<div class="chart-container">
<canvas id="companyChart"></canvas>
</div>

<div class="chart-container">
<canvas id="branchChart"></canvas>
</div>

<script>

// GOOGLE SHEET CSV LINK

const sheetURL =
"https://docs.google.com/spreadsheets/d/1wB72mFM70AToOAfPmAJepm9IR8HH0lV4M2sVsap3ZnM/export?format=csv";

fetch(sheetURL)
.then(res=>res.text())
.then(data=>{

let rows=data.split("\n").slice(1);

let companyCount={};
let branchCount={};

rows.forEach(r=>{

let c=r.split(",");

if(c.length>5){

$("#placementTable tbody").append(`
<tr>
<td>${c[0]||""}</td>
<td>${c[1]||""}</td>
<td>${c[2]||""}</td>
<td>${c[3]||""}</td>
<td>${c[4]||""}</td>
<td>${c[5]||""}</td>
<td>${c[6]||""}</td>
<td>${c[7]||""}</td>
<td>${c[8]||""}</td>
<td>${c[9]||""}</td>
<td>${c[10]||""}</td>
<td>${c[11]||""}</td>
<td>${c[12]||""}</td>
<td>${c[13]||""}</td>
<td>${c[14]||""}</td>
<td>${c[15]||""}</td>
</tr>
`);

let company=c[8]||"Unknown";
let branch=c[4]||"Unknown";

companyCount[company]=(companyCount[company]||0)+1;
branchCount[branch]=(branchCount[branch]||0)+1;

}

});

$("#students").text(rows.length);
$("#offers").text(rows.length);

$('#placementTable').DataTable({

dom:'Bfrtip',

buttons:[
'excel',
'csv',
'pdf',
'print'
]

});

new Chart(document.getElementById('companyChart'),{
type:'bar',
data:{
labels:Object.keys(companyCount),
datasets:[{
label:'Company Wise Count',
data:Object.values(companyCount)
}]
}
});

new Chart(document.getElementById('branchChart'),{
type:'pie',
data:{
labels:Object.keys(branchCount),
datasets:[{
data:Object.values(branchCount)
}]
}
});

document.getElementById("loader").style.display="none";

});

</script>

</body>
</html>
