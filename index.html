<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Rummy Score</title>

<style>

body{
font-family:Arial,sans-serif;
text-align:center;
background:#f5f5f5;
}

h1{
margin:20px;
}

table{
margin:auto;
border-collapse:collapse;
background:white;
}

th,td{

border:1px solid #000;
padding:10px;
min-width:90px;
text-align:center;

}

th{

background:yellow;

}

.total{

font-size:28px;
font-weight:bold;
background:yellow;

}

.red{

background:red !important;
color:white;

}

</style>

</head>

<body>

<h1>Rummy Score</h1>

<div id="table"></div>

<script>

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSDqXx9kHrTNf-SQLWwgLO4igXPZIGzuXkiFKIyHBPUe9EFsCfrVWvVZCupxEzCWtnSeVDBlUEGytOe/pub?output=csv";

fetch(csvUrl)
.then(res=>res.text())
.then(csv=>{

const rows = csv.trim().split("\n")
.map(r => r.split(","));

let html="<table>";

for(let i=0;i<rows.length;i++){

html+="<tr>";

for(let j=0;j<rows[i].length;j++){

let value=rows[i][j];

if(i==0){

let score=Number(value);

if(!isNaN(score) && score>=200){

html+=`
<td class="total red">
${score}
<br>
ELIMINATED
</td>
`;

}else{

html+=`
<td class="total">
${value}
</td>
`;

}

}

else if(i==1){

let score=Number(rows[0][j]);

if(!isNaN(score) && score>=200){

html+=`
<th class="red">
${value}
</th>
`;

}else{

html+=`
<th>
${value}
</th>
`;

}

}

else{

html+=`
<td>
${value}
</td>
`;

}

}

html+="</tr>";

}

html+="</table>";

document.getElementById("table").innerHTML=html;

});

</script>

</body>
</html>
