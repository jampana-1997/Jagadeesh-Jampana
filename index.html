<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training & Placement Dashboard</title>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1f3a;
color:#fff;
}

.header{
background:#07203f;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
padding:20px;
}

.card{
background:#123a6d;
padding:20px;
border-radius:12px;
text-align:center;
}

.card h2{
font-size:35px;
margin:0;
}

.table-section{
padding:20px;
}

.chart-box{
background:white;
margin:20px;
padding:20px;
border-radius:10px;
}

table{
color:black;
}

.loader{
position:fixed;
width:100%;
height:100%;
background:#081426;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
z-index:999;
}

</style>
</head>
<body>

<div class="loader" id="loader">
Loading Placement Data...
</div>

<div class="header">
TRAINING & PLACEMENT CELL DASHBOARD
</div>

<div class="cards">

<div class="card">
<h2 id="students">0</h2>
<p>Total Students</p>
</div>

<div class="card">
<h2 id="offers">0</h2>
<p>Total Offers</p>
</div>

<div class="card">
<h2 id="companies">0</h2>
<p>Total Companies</p>
</div>

<div class="card">
<h2 id="highest">0</h2>
<p>Highest Package</p>
</div>

</div>

<div class="table-section">

<table id="placementTable" class="display" width="100%">

<thead>

<tr>

<th>Roll No</th>
<th>Batch</th>
<th>Name</th>
<th>Gender</th>
<th>Branch</th>
<th>Mobile</th>
<th>Email</th>
<th>Campus</th>
<th>Company</th>
<th>Role</th>
<th>Nature</th>
<th>Paid/Unpaid</th>
<th>Stipend</th>
<th>Package</th>
<th>Internship</th>
<th>Offer</th>

</tr>

</thead>

<tbody></tbody>

</table>

</div>

<div class="chart-box">
<canvas id="companyChart"></canvas>
</div>

<div class="chart-box">
<canvas id="branchChart"></canvas>
</div>

<script>

const sheetURL =
"https://docs.google.com/spreadsheets/d/1wB72mFM70AToOAfPmAJepm9IR8HH0lV4M2sVsap3ZnM/export?format=csv";

fetch(sheetURL)

.then(response => response.text())

.then(csv => {

let rows = csv.split("\n").slice(1);

let companyCount={};
let branchCount={};

let highestPackage=0;

rows.forEach(row=>{

let col=row.split(",");

if(col.length<10) return;

$("#placementTable tbody").append(`
<tr>
<td>${col[0]||""}</td>
<td>${col[1]||""}</td>
<td>${col[2]||""}</td>
<td>${col[3]||""}</td>
<td>${col[4]||""}</td>
<td>${col[5]||""}</td>
<td>${col[6]||""}</td>
<td>${col[7]||""}</td>
<td>${col[8]||""}</td>
<td>${col[9]||""}</td>
<td>${col[10]||""}</td>
<td>${col[11]||""}</td>
<td>${col[12]||""}</td>
<td>${col[13]||""}</td>
<td>${col[14]||""}</td>
<td>${col[15]||""}</td>
</tr>
`);

let company=col[8]||"Unknown";
let branch=col[4]||"Unknown";

companyCount[company]=(companyCount[company]||0)+1;
branchCount[branch]=(branchCount[branch]||0)+1;

let salary=parseFloat(col[13])||0;

if(salary>highestPackage){
highestPackage=salary;
}

});

$("#students").text(rows.length);
$("#offers").text(rows.length);
$("#companies").text(Object.keys(companyCount).length);
$("#highest").text(highestPackage);

$('#placementTable').DataTable({

responsive:true,

dom:'Bfrtip',

buttons:[
'excel',
'csv',
'pdf',
'print'
]

});

new Chart(document.getElementById("companyChart"),{

type:'bar',

data:{
labels:Object.keys(companyCount),
datasets:[{
label:'Company Wise Placements',
data:Object.values(companyCount)
}]
}

});

new Chart(document.getElementById("branchChart"),{

type:'pie',

data:{
labels:Object.keys(branchCount),
datasets:[{
data:Object.values(branchCount)
}]
}

});

document.getElementById("loader").style.display="none";

});

</script>

</body>
</html>
