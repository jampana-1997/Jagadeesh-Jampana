<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGIT Placement Records</title>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f4f4;
}

.header{
    background:linear-gradient(to right,#002855,#004080);
    color:white;
    text-align:center;
    padding:15px;
}

.header h1{
    margin:0;
}

.stats{
    background:#0b7d3b;
    color:white;
    display:flex;
    justify-content:center;
    gap:40px;
    padding:10px;
    font-size:18px;
    font-weight:bold;
}

.filters{
    background:white;
    padding:10px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.filters input,
.filters select{
    padding:8px;
    border:1px solid #ccc;
    border-radius:5px;
}

.container{
    padding:10px;
}

table{
    width:100%;
}
</style>
</head>
<body>

<div class="header">
    <h1>MGIT Placement Records</h1>
    <h3>Academic Year 2025 - 2026</h3>
</div>

<div class="stats">
    <div>Total Offers: <span id="offers">0</span></div>
    <div>Total Placed Students: <span id="placed">0</span></div>
</div>

<div class="filters">
    <input type="text" id="searchBox" placeholder="Search Student">

    <select id="batchFilter">
        <option value="">All Batches</option>
    </select>

    <select id="branchFilter">
        <option value="">All Branches</option>
    </select>
</div>

<div class="container">
<table id="placementTable" class="display">
    <thead>
        <tr>
            <th>Roll Number</th>
            <th>Batch</th>
            <th>Name</th>
            <th>Gender</th>
            <th>Branch</th>
            <th>Mobile</th>
            <th>Email</th>
            <th>Company</th>
            <th>Role</th>
            <th>Package</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

// Mee Google Sheet CSV URL
const csvUrl =
"https://docs.google.com/spreadsheets/d/1w-EYhI3uYZABT87dHevtem6XYpDHS4tX/export?format=csv";

Papa.parse(csvUrl,{
    download:true,
    header:true,
    complete:function(results){

        let data = results.data;
        let tbody = "";

        let batches = new Set();
        let branches = new Set();

        data.forEach(row=>{

            batches.add(row.Batch);
            branches.add(row.Branch);

            tbody += `
            <tr>
                <td>${row["Roll Number"]||""}</td>
                <td>${row["Batch"]||""}</td>
                <td>${row["Name"]||""}</td>
                <td>${row["Gender"]||""}</td>
                <td>${row["Branch"]||""}</td>
                <td>${row["Mobile Number"]||""}</td>
                <td>${row["Email Id"]||""}</td>
                <td>${row["Company Placed"]||""}</td>
                <td>${row["Role"]||""}</td>
                <td>${row["Salary package"]||""}</td>
            </tr>`;
        });

        document.querySelector("#placementTable tbody").innerHTML = tbody;

        $("#placementTable").DataTable();

        document.getElementById("offers").innerText = data.length;
        document.getElementById("placed").innerText = data.length;

        batches.forEach(b=>{
            if(b){
                batchFilter.innerHTML +=
                `<option>${b}</option>`;
            }
        });

        branches.forEach(b=>{
            if(b){
                branchFilter.innerHTML +=
                `<option>${b}</option>`;
            }
        });

    }
});

</script>

</body>
</html>
