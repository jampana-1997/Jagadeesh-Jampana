<!DOCTYPE html>
<html>
<head>
    <title>Training & Placement Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>

<div class="header">
    Training & Placement Dashboard
</div>

<div class="cards">
    <div class="card">
        <h2 id="students">0</h2>
        <p>Total Students</p>
    </div>

    <div class="card">
        <h2 id="companies">0</h2>
        <p>Companies</p>
    </div>

    <div class="card">
        <h2 id="offers">0</h2>
        <p>Offers</p>
    </div>

    <div class="card">
        <h2 id="highest">0</h2>
        <p>Highest Package</p>
    </div>
</div>

<div class="filters">
    <select id="branchFilter"></select>
    <select id="genderFilter"></select>
    <select id="batchFilter"></select>

    <input type="text"
           id="searchBox"
           placeholder="Search..."
           onkeyup="filterTable()">
</div>

<table>
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
</table>

<script src="js/app.js"></script>

</body>
</html>
