<!DOCTYPE html>
<html>
<head>
  <title>Placements Dashboard</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    /* HEADER AREA */
    .top-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 15px;
    }

    /* SEARCH BAR */
    .search-box {
      width: 60%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }

    .search-box:focus {
      border-color: #333;
    }

    /* COUNT */
    .count {
      margin-top: 8px;
      font-size: 16px;
      font-weight: bold;
    }

    /* TABLE */
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      font-size: 14px;
      text-align: left;
    }

    th {
      background: #333;
      color: white;
      position: sticky;
      top: 0;
    }

    tr:hover {
      background: #f0f0f0;
    }
  </style>
</head>

<body>

<h1>Placements Dashboard</h1>

<!-- ✅ SEARCH + COUNT SEPARATE HEADER -->
<div class="top-bar">
  <input 
    type="text" 
    id="search" 
    class="search-box"
    placeholder="Search Name, Roll No, Company..." 
    onkeyup="filterData()"
  >

  <div class="count" id="count">Loading data...</div>
</div>

<table>
  <thead>
    <tr id="header"></tr>
  </thead>
  <tbody id="body"></tbody>
</table>

<script>

const sheetID = "1wB72mFM70AToOAfPmAJepm9IR8HH0lV4M2sVsap3ZnM";
const url = `https://opensheet.elk.sh/${sheetID}/1`;

let data = [];

fetch(url)
  .then(res => res.json())
  .then(res => {
    data = res;
    buildTable(data);
    updateCount(data.length);
  })
  .catch(err => {
    document.getElementById("count").innerText = "Failed to load data";
    console.error(err);
  });

/* BUILD TABLE HEADER */
function buildTable(data) {
  const header = document.getElementById("header");
  header.innerHTML = "";

  if (data.length === 0) return;

  Object.keys(data[0]).forEach(k => {
    header.innerHTML += `<th>${k}</th>`;
  });

  showData(data);
}

/* SHOW DATA */
function showData(data) {
  const body = document.getElementById("body");
  body.innerHTML = "";

  data.forEach(row => {
    let tr = "<tr>";
    Object.values(row).forEach(val => {
      tr += `<td>${val}</td>`;
    });
    tr += "</tr>";
    body.innerHTML += tr;
  });
}

/* SEARCH + FILTER */
function filterData() {
  const val = document.getElementById("search").value.toLowerCase();

  const filtered = data.filter(row =>
    Object.values(row).some(v =>
      String(v).toLowerCase().includes(val)
    )
  );

  showData(filtered);
  updateCount(filtered.length);
}

/* COUNT UPDATE */
function updateCount(count) {
  document.getElementById("count").innerText =
    `Total Records: ${count}`;
}

</script>

</body>
</html>
