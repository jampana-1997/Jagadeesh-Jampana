<!DOCTYPE html>
<html>
<head>
<title>Coin Toss</title>
<style>
body {
  text-align:center;
  font-family:Arial;
  background:#1e90ff;
  color:white;
}

.coin {
  font-size:120px;
  margin:30px;
}

button {
  padding:10px 20px;
  font-size:18px;
  cursor:pointer;
}
</style>
</head>
<body>

<h1>🪙 Coin Toss Game</h1>

<div class="coin" id="coin">🪙</div>

<h2 id="result">Click toss button</h2>

<button onclick="tossCoin()">Toss Coin</button>

<script>
function tossCoin(){
  let outcomes = ["HEADS", "TAILS"];
  let emojis = ["🙂 HEADS", "🪙 TAILS"];

  let index = Math.floor(Math.random() * 2);

  document.getElementById("coin").innerText = "🪙";
  document.getElementById("result").innerText = emojis[index];
}
</script>

</body>
</html>
