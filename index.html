<script>

const csvUrl="https://docs.google.com/spreadsheets/d/e/2PACX-1vSDqXx9kHrTNf-SQLWwgLO4igXPZIGzuXkiFKIyHBPUe9EFsCfrVWvVZCupxEzCWtnSeVDBlUEGytOe/pub?output=csv";

fetch(csvUrl)
.then(res=>res.text())
.then(csv=>{

const rows=csv.trim().split("\n").map(r=>r.split(","));

let html="<table>";

for(let i=0;i<rows.length;i++){

html+="<tr>";

for(let j=0;j<rows[i].length;j++){

let value=rows[i][j].trim();

if(i===0){

let score=parseInt(value)||0;

if(score>=200){

html+=`
<td style="
background:red;
color:white;
font-size:30px;
font-weight:bold;
">
${score}
<br>
ELIMINATED
</td>
`;

}else{

html+=`
<td style="
background:yellow;
font-size:30px;
font-weight:bold;
">
${score}
</td>
`;

}

}

else if(i===1){

let score=parseInt(rows[0][j])||0;

if(score>=200){

html+=`
<th style="
background:red;
color:white;
font-weight:bold;
">
${value}
</th>
`;

}else{

html+=`
<th style="background:yellow">
${value}
</th>
`;

}

}

else{

html+=`<td>${value}</td>`;

}

}

html+="</tr>";

}

html+="</table>";

document.getElementById("table").innerHTML=html;

});

</script>
