<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Jagadeesh Rummy Score</title>

<style>

body{
font-family:Arial,sans-serif;
text-align:center;
background:#f5f5f5;
margin:0;
padding:20px;
}

h1{
font-size:40px;
margin-bottom:20px;
}

table{
margin:auto;
border-collapse:collapse;
background:white;
}

th,td{

border:1px solid black;

padding:10px;

min-width:100px;

text-align:center;

}

.total{

background:yellow;

font-size:32px;

font-weight:bold;

}

.yellow{

background:yellow;

}

.red{

background:red !important;

color:white !important;

font-weight:bold;

}

.green{

background:green !important;

color:white !important;

font-weight:bold;

}

.rank{

display:block;

font-size:14px;

margin-top:5px;

}

.profile{

width:80px;

height:80px;

border-radius:50%;

object-fit:cover;

border:3px solid white;

margin-bottom:8px;

}

</style>

</head>

<body>

<h1>Jagadeesh Rummy Score</h1>

<div id="table"></div>

<script>

const csvUrl="https://docs.google.com/spreadsheets/d/e/2PACX-1vSDqXx9kHrTNf-SQLWwgLO4igXPZIGzuXkiFKIyHBPUe9EFsCfrVWvVZCupxEzCWtnSeVDBlUEGytOe/pub?output=csv";

fetch(csvUrl)

.then(res=>res.text())

.then(csv=>{

const rows=csv.trim().split("\n")

.map(r=>r.split(","));

const totals=rows[0].map(x=>parseInt(x)||0);

const active=totals.filter(x=>x<200);

const winnerScore=active.length==1 ? active[0] : -1;

const ranks=[...totals]

.map((score,index)=>({score,index}))

.sort((a,b)=>a.score-b.score);

let html="<table>";

for(let i=0;i<rows.length;i++){

if(i==2) continue; // Photo row ని tableలో చూపించదు

html+="<tr>";

for(let j=0;j<rows[i].length;j++){

let value=rows[i][j].trim();

if(i==0){

let score=parseInt(value)||0;

if(score>=200){

html+=`

<td class="total red">

${score}

<br>

ELIMINATED

</td>

`;

}

else if(score==winnerScore){

html+=`

<td class="total green">

${score}

<br>

WINNER 🏆

</td>

`;

}

else{

html+=`

<td class="total">

${score}

</td>

`;

}

}

else if(i==1){

let score=totals[j];

let rank=ranks.findIndex(x=>x.index==j)+1;

let photo="";

if(rows[2] && rows[2][j])

photo=rows[2][j].trim();

let cls="yellow";

let status="";

if(score>=200){

cls="red";

status="<br>ELIMINATED";

}

else if(score==winnerScore){

cls="green";

status="<br>🏆 WINNER";

}

html+=`

<th class="${cls}">

${photo?

`<img src="${photo}" class="profile">`

:""}

<br>

${value}

${status}

<span class="rank">

Rank ${rank}

</span>

</th>

`;

}

else{

html+=`

<td>

${value}

</td>

`;

}

}

html+="</tr>";

}

html+="</table>";

document.getElementById("table").innerHTML=html;

})

.catch(err=>{

document.getElementById("table").innerHTML="Error Loading Data";

});

</script>

</body>
</html>
